<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Verification</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">

    <!-- Header with school logo -->
    <header class="header">
      <div class="logo-container">
        <img src="img/logo.png" alt="School Logo" class="school-logo" />
      </div>
      <h1 class="title">Student Verification</h1>
      <p class="subtitle">Enter admission number to view student details</p>
    </header>

    <!-- Search section -->
    <section class="search-area">
      <label for="admInput" class="visually-hidden">Admission Number</label>
      <div class="search-row">
        <input 
          id="admInput" 
          type="text" 
          inputmode="text" 
          placeholder="e.g. ADM123" 
          aria-label="Admission Number"
        />
        <button id="searchBtn" type="button" aria-label="Search Student">Search</button>
      </div>
      <p id="hint" class="hint">
        Search is case-insensitive. Results will update when you type a new query.
      </p>
    </section>

    <!-- Results area -->
    <section id="resultArea" class="result-area" aria-live="polite"></section>

    <!-- Footer -->
    <footer class="footer">
      <small>THIKA COLLEGE OF EXCELLENCE</small>
    </footer>
  </main>

  <script src="scripte.js"></script>
</body>
</html>
